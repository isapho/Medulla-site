# Cloudflare Worker for the interactive Medulla bot (see telegram/BOT.md).
# Deploy from the telegram/ folder:  npx wrangler deploy
name = "medulla-bot"
main = "worker.mjs"
compatibility_date = "2026-09-01"

[vars]
# Where the bot reads data/facts.json, data/glossary.json and data/bot-strings.json
# (no trailing slash). The public repository works even while the website is offline.
DATA_URL = "https://raw.githubusercontent.com/isapho/Medulla-site/main"
# The public address of the website. Empty = no website buttons or links in the
# bot. Set it to "https://isapho.github.io/Medulla-site" (or your domain) when the site is live.
SITE_URL = ""

# Secrets (never put them here):
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put WEBHOOK_SECRET
