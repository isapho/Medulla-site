# Runs on every push and pull request: content checks and the bot tests.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Content and translation checks
        run: node tools/build.js --check
      - name: Telegram bot tests (mock server, nothing is sent)
        run: node --test telegram/
