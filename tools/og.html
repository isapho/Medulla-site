<!doctype html>
<!-- Share image template (1200 × 630). Exported by tools/export-png.mjs to assets/brand/og-image.jpg. -->
<html lang="uz">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: Sora, system-ui, sans-serif; color: #fff;
    background: radial-gradient(70% 90% at 78% 40%, #3A2C93 0%, #1A1550 45%, #0D1128 100%);
  }
  .waves { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; mix-blend-mode: screen; }
  .brain { position: absolute; right: 70px; top: 30px; width: 470px; filter: drop-shadow(0 30px 60px rgba(108, 92, 231, .5)); }
  .brand { position: absolute; left: 72px; top: 70px; display: flex; gap: 22px; align-items: center; }
  .brand img { width: 86px; height: 86px; border-radius: 22px; box-shadow: 0 16px 30px -12px rgba(0, 0, 0, .6); }
  .brand b { display: block; font-size: 44px; letter-spacing: -.02em; }
  .brand small { display: block; margin-top: 6px; font-size: 16px; font-weight: 600; letter-spacing: .24em; color: #C9C2FF; }
  h1 { position: absolute; left: 72px; top: 232px; margin: 0; width: 560px; font-size: 54px; line-height: 1.12; letter-spacing: -.02em; }
  h1 span { color: #FFC58C; }
  .meta { position: absolute; left: 72px; top: 492px; font: 600 20px system-ui, sans-serif; color: rgba(255, 255, 255, .82); }
  .langs { position: absolute; left: 72px; top: 538px; display: flex; gap: 12px; }
  .langs span { padding: 8px 18px; border-radius: 999px; background: rgba(255, 255, 255, .12); font: 700 17px system-ui, sans-serif; }
  .cast { position: absolute; right: 24px; bottom: 14px; display: flex; align-items: flex-end; }
  .cast img { width: 196px; height: 196px; margin-left: -30px; }
  .cast img.lumi { width: 150px; height: 150px; position: absolute; right: 440px; bottom: 420px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, #6C5CE7, #A29BFE 50%, #FF9F43); }
</style>
</head>
<body>
  <img class="waves" src="../assets/img/waves.webp" alt="">
  <img class="brain" src="../assets/img/brain-glass.webp" alt="">
  <div class="brand"><img src="../assets/brand/logo-tile.webp" alt=""><div><b>Medulla</b><small>MIND · LEARN · GROW</small></div></div>
  <h1>Miya salomatligi — <span>yoshlar uchun tushunarli tilda</span></h1>
  <p class="meta">Faktlar · Laboratoriya · Kunlik topshiriq</p>
  <div class="langs"><span>UZ</span><span>RU</span><span>EN</span></div>
  <div class="cast">
    <img src="../assets/characters/poses/dendi-hello.webp" alt="">
    <img src="../assets/characters/poses/memo-correct.webp" alt="">
    <img src="../assets/characters/poses/octa-curious.webp" alt="">
    <img src="../assets/characters/poses/syno-correct.webp" alt="">
    <img class="lumi" src="../assets/characters/poses/lumi-aha.webp" alt="">
  </div>
  <div class="bar"></div>
</body>
</html>
